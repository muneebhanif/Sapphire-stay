<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StaySite – Sapphire Stay Hotel Management System">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StaySite | Sapphire Stay Hotel</title>

  <!-- Google Fonts preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Lightweight skeleton while Flutter initializes */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      background: #F5F3EF;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .skel {
      background: linear-gradient(90deg, #E0DCD5 25%, #F8F7F4 37%, #E0DCD5 63%);
      background-size: 400% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
      border-radius: 8px;
    }
    .skel-title {
      width: 220px;
      height: 28px;
      margin-bottom: 16px;
    }
    .skel-subtitle {
      width: 340px;
      height: 14px;
      margin-bottom: 24px;
    }
    .skel-row {
      display: flex;
      gap: 16px;
      width: 100%;
      flex-wrap: wrap;
    }
    .skel-card {
      width: min(360px, 100%);
      height: 220px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="skel skel-title"></div>
    <div class="skel skel-subtitle"></div>
    <div class="skel-row">
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
